name: Test
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Start SeaweedFS
        env:
          COMPOSE_PROJECT_NAME: s3site-test
        run: bash scripts/seaweedfs-setup.sh

      - name: Run unit and integration tests
        run: |
          source scripts/seaweedfs-env.sh
          go test ./... -race -count=1
      - name: Static checks
        run: go vet ./...
      - name: SeaweedFS diagnostics
        if: failure()
        run: docker compose -p s3site-test -f examples/oidc/compose.yml logs --tail 100 s3
      - name: Stop local S3 service
        if: always()
        run: docker compose -p s3site-test -f examples/oidc/compose.yml down --volumes --remove-orphans
  zitadel:
    name: Zitadel integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Test real Zitadel login and access policies
        run: ./examples/oidc/test-zitadel.sh
